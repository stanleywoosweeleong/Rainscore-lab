# RainScore Lab — collect forecasts + ERA5 actuals for every seed orchard, daily.
# Writes data/rainscore-data.json; the app loads it on open, so results are ready
# without anyone fetching by hand. Manual "Update records" and drive mode still work
# and only fetch what this file doesn't already cover.
name: RainScore daily data

on:
  schedule:
    - cron: "11 20 * * *"   # 20:11 UTC = 04:11 Malaysia time, before the morning broadcast
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write               # needed to request the Pages build after the bot commit (see below)

concurrency:
  group: rainscore-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect forecasts and ERA5
        id: collect
        continue-on-error: true      # still commit what succeeded; fail the job afterwards
        run: node tools/collect.mjs

      - name: Commit data file
        id: commit
        if: always()
        run: |
          git config user.name  "rainscore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rainscore-data.json
          if git diff --cached --quiet; then
            echo "No change."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily collect $(TZ=Asia/Kuala_Lumpur date +%Y-%m-%d)"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages publishes from a branch, and GitHub does NOT start a Pages build for commits
      # pushed with GITHUB_TOKEN — so without this step the new data file sits in the repo
      # while the live site keeps serving yesterday's. Requesting the build explicitly
      # makes the push reach the published app.
      - name: Publish to GitHub Pages
        if: always() && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent; then
            echo "Pages build requested."
          else
            echo "::warning::Could not request a Pages build. If this site publishes from a branch, check that Pages is enabled; if it publishes with GitHub Actions, add a deploy job instead."
          fi

      - name: Report failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collector reported too many failed orchards — see the 'Collect' step log."
          exit 1
